<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELF-X | Sign In</title>
  <link rel="stylesheet" href="CSS/Style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-mark">SELF-X</div>
      <p class="auth-kicker">EC466 SDN MISSION CONTROL</p>
      <h1 id="login-title">Sign in to SELF-X</h1>
      <p class="auth-copy">Authenticate to access the dashboard and its protected telemetry views.</p>

      <form id="loginForm" class="auth-form" method="post" action="/api/auth/login">
        <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" class="auth-submit">Sign in</button>
        <p id="loginError" class="auth-error" role="alert" hidden></p>
      </form>
      <p class="auth-note">Session access expires after a period of inactivity.</p>
    </section>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const error = document.getElementById('loginError');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new URLSearchParams(new FormData(form)),
          credentials: 'same-origin'
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          error.textContent = data.error || 'Sign-in failed.';
          error.hidden = false;
          return;
        }
        window.location.assign(data.redirect || '/');
      } catch (requestError) {
        error.textContent = 'Unable to reach the authentication service.';
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
